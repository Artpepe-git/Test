{% extends "base.html" %}{% from "_m.html" import csrf with context %}
{% block title %}Смена пароля{% endblock %}
{% block body %}
<div class="card login">
  <h1>Смена пароля</h1>
  {% if g.user.must_change %}<p class="muted">Вы вошли с временным паролем. Задайте свой, чтобы продолжить.</p>{% endif %}
  <form method="post">{{ csrf() }}
    <label>Текущий пароль</label><input type="password" name="old" required autocomplete="current-password">
    <label>Новый пароль (от 6 символов)</label><input type="password" name="new" required autocomplete="new-password">
    <label>Повторите новый пароль</label><input type="password" name="again" required autocomplete="new-password">
    <p><button class="btn primary">Сохранить</button></p>
  </form>
</div>
{% endblock %}
