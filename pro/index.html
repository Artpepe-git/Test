<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>УчительPRO</title>
<meta name="description" content="Тренажёр педагогических кейсов: ветвящиеся ситуации, разбор по шагам, мастер-классы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Дизайн-система «Волна»: тёмно-синяя и тёмно-зелёная темы, один столбец под телефон. */
:root{
  color-scheme:dark;
  --bg:#02040b; --surface:#070b18; --surface-raised:#111a33; --ink:#f4f7ff; --muted:#9aa6c4;
  --line:#18213d; --border-strong:#5a6a96; --accent:#8fbaff; --select:#1f4fd1; --select-hover:#2a5ae0;
  --wave:#a9c8ff; --glow:#3b6fff; --deep:#0d2a78;
  --success:#6fe3a4; --danger:#ff7c8c; --warn:#ffc46b;
  --ok-soft:rgba(111,227,164,.13); --warn-soft:rgba(255,196,107,.13); --bad-soft:rgba(255,124,140,.13);
  --glow-select:0 0 18px rgba(59,111,255,.55); --shadow:0 2px 12px rgba(0,0,0,.45);
  --font:"Golos Text","Noto Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="green"]{
  --bg:#010804; --surface:#04120a; --surface-raised:#0c2617; --ink:#effff5; --muted:#94b8a3;
  --line:#123221; --border-strong:#4f8a68; --accent:#7beeaa; --select:#0f7a41; --select-hover:#11823f;
  --wave:#b4ffd2; --glow:#2fcf7d; --deep:#0b5a30; --success:#b8f5cf; --danger:#ff8a8a;
  --glow-select:0 0 18px rgba(47,207,125,.5);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/22px var(--font);-webkit-tap-highlight-color:transparent}
b,strong,h1,h2,h3{font-weight:600}
button,input,select{font:inherit;color:inherit}
#wall{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(130% 60% at 50% 62%,var(--deep) 0%,transparent 62%),
             linear-gradient(180deg,#000 0%,var(--bg) 25%,var(--bg) 80%,#000 100%)}
#wall canvas{position:absolute;inset:0;width:100%;height:100%}
.app{position:relative;z-index:1;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.top b{color:var(--ink);font-size:14px}
.top .t{display:flex;gap:10px;align-items:center}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-size:13px}
.lnk:hover{text-decoration:underline}
h1{font-size:30px;line-height:36px;font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:21px;line-height:27px;margin:0;text-wrap:balance}
h3{font-size:16px;line-height:22px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:19px}
.panel{background:rgba(7,11,24,.86);border:1px solid var(--line);border-radius:14px;padding:16px;
  backdrop-filter:blur(6px);box-shadow:var(--shadow)}
:root[data-theme="green"] .panel{background:rgba(3,12,7,.86)}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text]{background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:6px;
  padding:11px;font-size:16px;outline:none;width:100%}
input[type=text]:focus{border-color:var(--accent);box-shadow:var(--glow-select)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--select);color:#fff;
  border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px}
.btn:hover{background:var(--select-hover)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{background:var(--surface-raised);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--accent)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14px}
/* навигация */
.nav{display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav button{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;font-size:15px;font-weight:600}
.nav button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
/* карточки кейсов */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:14px;text-align:left;width:100%;
  background:rgba(7,11,24,.86);border:1px solid var(--line);cursor:pointer;color:inherit;box-shadow:var(--shadow)}
:root[data-theme="green"] .card{background:rgba(3,12,7,.86)}
.card:hover{border-color:var(--border-strong)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3{flex:1;min-width:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.stars{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.stars i{opacity:.28;font-style:normal}
.badge{font-size:12.5px;border-radius:99px;padding:2px 10px;white-space:nowrap}
.badge.done{background:var(--ok-soft);color:var(--success)}
.badge.part{background:var(--warn-soft);color:var(--warn)}
.badge.fail{background:var(--bad-soft);color:var(--danger)}
/* сцена */
.scene{display:flex;flex-direction:column;gap:12px}
.chars{display:flex;gap:8px;flex-wrap:wrap}
.ch{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:8px 10px;
  border:1px dashed var(--line);border-radius:12px;background:var(--surface-raised);font-size:12px;color:var(--muted)}
.ch em{font-style:normal;font-size:19px;line-height:19px}
.ch b{color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;line-height:15px}
.speaker{font-size:12.5px;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.text{font-size:16px;line-height:24px;white-space:pre-wrap}
.prev{border-left:2px solid var(--line);padding-left:10px;color:var(--muted);font-size:13.5px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:13px 15px;border-radius:12px;background:var(--surface-raised);
  border:1px solid var(--border-strong);color:var(--ink);cursor:pointer;font-size:15px;line-height:21px}
.choice:hover{border-color:var(--accent);box-shadow:var(--glow-select)}
.choice.locked{cursor:not-allowed;border-style:dashed;border-color:var(--line);color:var(--muted)}
.choice .hint{display:block;margin-top:5px;font-size:12.5px;color:var(--muted)}
/* шкалы */
.meters{display:flex;flex-direction:column;gap:7px}
.meter{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.meter .tr{grid-column:1/-1;height:5px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.meter .tr i{position:absolute;top:0;bottom:0;background:var(--wave);box-shadow:0 0 8px var(--glow)}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.done{background:var(--wave)}
.steps i.cur{background:var(--accent);box-shadow:var(--glow-select)}
/* итоги */
.hero{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.big{font-size:44px;line-height:48px;letter-spacing:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.bar .tr{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--wave);box-shadow:0 0 8px var(--glow)}
.step{display:flex;flex-direction:column;gap:7px;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-raised)}
.step .r{font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;align-self:flex-start}
.r.best{background:var(--ok-soft);color:var(--success)}
.r.good{background:var(--warn-soft);color:var(--warn)}
.r.weak{background:var(--bad-soft);color:var(--danger)}
.step .q{font-size:13.5px;color:var(--muted)}
.step .fb{font-size:14px;line-height:20px}
.step .alt{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
ul.ls{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
/* мастер-классы */
.mkblock{display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-raised)}
.mkblock .n{font-size:12.5px;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.say{margin:0;padding:10px 12px;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  background:rgba(255,196,107,.1);font-size:15px;line-height:22px}
.mknote{font-size:13.5px;color:var(--muted)}
.mkmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.mkmeta b{color:var(--muted);font-weight:400}
/* qr */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qrbox .b{background:#fff;padding:12px;border-radius:14px;width:min(290px,78vw)}
.qrbox svg{display:block;width:100%;height:auto}
.link{word-break:break-all;font-size:13.5px;color:var(--accent)}
.err{color:var(--danger);font-size:13.5px}
@media print{
  #wall,.nav,.top,.btn,.lnk{display:none!important}
  body{background:#fff;color:#000}
  .panel,.step,.mkblock,.card{border-color:#bbb;background:#fff;box-shadow:none}
}

</style>
</head>
<body>
<div id="wall"></div>
<main class="app" id="app"></main>
<script>
const CASES=[{"slug":"vol-child-conflict","title":"«Не буду! Вы мне ничего не сделаете»","description":"Мастер-класс для младших школьников: ребёнок демонстративно отодвигает материалы и спорит, остальные отвлекаются. Нужно остановить конфликт, сохранить рабочую атмосферу и выяснить причину отказа.","category":"Конфликты с детьми","difficulty":1,"duration_min":3,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"S1","nodes":{"S1":{"name":"«Не буду! Вы мне ничего не сделаете»","scene":"masterclass","characters":[{"id":"student_a","mood":"angry"}],"speaker":"Ситуация","text":"Вы волонтёр и ведёте творческий мастер-класс для младших школьников. Во время самостоятельной работы один мальчик демонстративно отодвигает материалы: «Не буду! Вы мне всё равно ничего не сделаете, вы не учитель». На замечание он спорит, остальные дети начинают отвлекаться. Даже после индивидуального обращения он заявляет: «Вы не имеете права меня заставлять». Что вы скажете?","choices":[{"id":"a","text":"«Если тебе не нравится заниматься, сядь на стул у стены и жди, пока мы закончим, или возвращайся, если передумаешь».","to":"E_RISK","scores":{"ETH":1,"TAC":-2,"EMP":-1},"feedback":"Правила обозначены, но ребёнок остаётся один со своим протестом и ощущением несправедливости."},{"id":"b","text":"«Раз ты не хочешь делать, побудь моим шпионом. Смотри, кто из ребят лучше справится с заданием, чтобы потом выбрать победителя».","to":"E_BEST","scores":{"COM":2,"EMP":2,"TAC":2},"feedback":"Ребёнок получает значимую роль вместо борьбы, и отказ перестаёт быть способом привлечь внимание."},{"id":"c","text":"«Ну и сиди тогда, ничего у тебя в жизни не получится».","to":"E_WORST","scores":{"EMP":-3,"ETH":-3},"feedback":"Обесценивание ребёнка разрушает контакт и нарушает профессиональную этику."},{"id":"d","text":"«Ого, какой ты смелый, как настоящий рыцарь, который охраняет свой замок. А мы тут вообще-то мастерим. Присоединяйся, когда закончишь охранять».","to":"E_OK","scores":{"COM":2,"EMP":1,"TAC":1},"feedback":"Юмор снимает напряжение и оставляет путь назад, но роли для ребёнка вы не предложили."}]},"E_RISK":{"final":true,"outcome":"partial","bonus":0,"title":"Правила есть, контакта нет","scene":"masterclass","characters":[],"speaker":"Итог","text":"Правила обозначены, но ребёнок может закатить истерику от ощущения несправедливости, и тогда конфликт выйдет из-под контроля."},"E_BEST":{"final":true,"outcome":"success","bonus":10,"title":"Конфликт улажен","scene":"masterclass","characters":[],"speaker":"Итог","text":"Ребёнок принимает новую роль и перестаёт мешать. Через некоторое время он, скорее всего, сам захочет что-то сделать, а если нет, то всё равно вовлечён в деятельность, и конфликт улажен."},"E_WORST":{"final":true,"outcome":"fail","bonus":0,"title":"Потеря контакта","scene":"masterclass","characters":[],"speaker":"Итог","text":"Следствие: жалоба от родителей и полная потеря контакта с ребёнком."},"E_OK":{"final":true,"outcome":"partial","bonus":9,"title":"Напряжение спало","scene":"masterclass","characters":[],"speaker":"Итог","text":"Напряжение спадает, ребёнок может улыбнуться и включиться в работу."}},"meters":[],"flag_titles":{},"review":{"theory":[{"title":"Отказ — это сообщение","text":"Демонстративное «не буду» часто защищает самооценку или привлекает внимание. Спор усиливает его, а новая роль даёт выход без потери лица."},{"title":"Не бороться, а перенаправлять","text":"Ребёнку проще принять роль («помощник», «жюри»), чем подчиниться требованию. Игровой формат работает с младшими школьниками лучше давления."}],"takeaways":["Вы не учитель — это не повод терять авторитет: он держится на уважении, а не на власти.","Дайте ребёнку роль, а не ультиматум.","Никогда не обесценивайте ребёнка, даже в сердцах."],"node_notes":{"S1":"Найдите выход, при котором ребёнок сохранит лицо, а группа продолжит работу."},"final_notes":{"E_RISK":"Рискованно: границы заданы, но выход из конфликта ребёнку не предложен.","E_BEST":"Лучший ход: вы не боретесь с отказом, а меняете роль ребёнка с «нарушителя» на «помощника».","E_WORST":"Худшее: фраза обесценивает ребёнка. Педагог не прогнозирует «будущее» ребёнка в сердцах.","E_OK":"Допустимо: шутка снимает напряжение, но ребёнок остаётся «охранником» и может не найти повода присоединиться."}}},{"slug":"vol-locked-room","title":"Закрытый кабинет и 15 детей","description":"За 10 минут до мастер-класса выясняется, что кабинет закрыт, материалы не привезли, 15 шумных детей ждут в коридоре, координатор не отвечает.","category":"Организационные ситуации","difficulty":2,"duration_min":5,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"S1","nodes":{"S1":{"name":"Закрытый кабинет и 15 детей","scene":"corridor","characters":[],"speaker":"Ситуация","text":"Вы приходите за 10 минут до начала мастер-класса. Выясняется, что аудитория закрыта, а материалы не привезли. В коридоре уже собираются 15 шумных детей, которых не с кем оставить. Координатор не отвечает на звонки. Что вы сделаете?","choices":[{"id":"a","text":"Устроить плотный круг на полу и провести физическую разминку или игру на месте.","to":"F_B","scores":{"TAC":3,"COM":1},"feedback":"Структура и сброс энергии, но в коридоре шумно."},{"id":"b","text":"Начать звонить родителям и просить забрать детей пораньше.","to":"F_C","scores":{"TAC":-2,"ETH":-1},"feedback":"Вы перекладываете проблему организаторов на родителей."},{"id":"c","text":"«Ребята, у нас секретная миссия: кабинет заколдован! Ваша задача — не выходить за эту линию, пока я ищу ключ. Кто выйдет, тот проиграл. Играем в спецагентов».","to":"F_A","scores":{"TAC":3,"COM":2,"ETH":1},"feedback":"Вы удерживаете детей игрой, не бросая их, и сразу начинаете решать проблему."},{"id":"d","text":"Заблокировать выход из коридора и уйти искать координатора.","to":"F_C","scores":{"ETH":-3,"TAC":-3},"feedback":"Дети без присмотра в замкнутом пространстве — грубое нарушение безопасности."}]},"F_A":{"name":"Ключ у вахтёра","scene":"corridor","characters":[],"speaker":"Ситуация","text":"Дети увлечённо играют в спецагентов. Вы выяснили, что ключ у вахтёра на первом этаже, но материалов всё равно нет. Ключ у вахтёра на первом этаже, а материалы нужно забрать в учебной части на другом этаже. Что вы сделаете с детьми?","choices":[{"id":"a","text":"Попросить проходящего педагога присмотреть за группой, пока вы идёте за ключом и материалами.","to":"E_BEST","scores":{"ETH":3,"TAC":2},"feedback":"Дети остаются под присмотром взрослого, вы решаете проблему."},{"id":"b","text":"Взять всех детей с собой и пойти колонной.","to":"E_GOOD","scores":{"TAC":1,"ETH":1},"feedback":"Дети с вами, но колонна из 15 детей по этажам неудобна и шумна."},{"id":"c","text":"Оставить детей играть на линии и быстро сбегать.","to":"E_FAIL","scores":{"ETH":-3},"feedback":"Игра не заменяет присмотр взрослого."}]},"F_B":{"name":"Недовольный педагог","scene":"corridor","characters":[{"id":"teacher_neighbor","mood":"neutral"}],"speaker":"Педагог","text":"Круг на полу получился шумным: из соседнего кабинета вышел недовольный педагог. «Вы мешаете занятиям!»","choices":[{"id":"a","text":"Извиниться, объяснить ситуацию и попросить помочь присмотреть за группой, пока вы ищете ключ.","to":"E_BEST","scores":{"COM":2,"EMP":1,"ETH":1},"feedback":"Вы признаёте шум и превращаете недовольство в помощь."},{"id":"b","text":"Перейти на тихую игру «шёпотом» и продолжить.","to":"E_GOOD","scores":{"TAC":2},"feedback":"Шум снижен, но проблема с кабинетом осталась."},{"id":"c","text":"Не обращать внимания.","to":"E_WEAK","scores":{"COM":-2},"feedback":"Конфликт с коллегой усугубится."}]},"F_C":{"name":"Звонок координатора","scene":"corridor","characters":[{"id":"coordinator","mood":"neutral"}],"speaker":"Координатор","text":"Координатор наконец перезвонил: «Что у вас там?» Детей в коридоре стало ещё больше, часть родителей уже ушла.","choices":[{"id":"a","text":"Коротко и честно доложить: что случилось, что сделано и что нужно (ключ, материалы, помощь).","to":"E_GOOD","scores":{"COM":2,"REF":2,"ETH":1},"feedback":"Чёткий отчёт возвращает вам контроль над ситуацией."},{"id":"b","text":"Сказать, что всё в порядке.","to":"E_FAIL","scores":{"ETH":-2,"REF":-2},"feedback":"Скрывать проблему опасно."},{"id":"c","text":"Обвинить организаторов во всём.","to":"E_WEAK","scores":{"COM":-2,"REF":-1},"feedback":"Обвинения не решают проблему."}]},"E_BEST":{"final":true,"outcome":"success","bonus":10,"title":"Миссия выполнена","scene":"corridor","characters":[],"speaker":"Итог","text":"Дети под присмотром, кабинет открыт, материалы привезены. Мастер-класс начинается почти вовремя."},"E_GOOD":{"final":true,"outcome":"partial","bonus":7,"title":"Занятие спасено","scene":"corridor","characters":[],"speaker":"Итог","text":"Проблему решили, хотя не идеально: потеряно время, но дети в безопасности."},"E_WEAK":{"final":true,"outcome":"partial","bonus":2,"title":"Беспорядок остался","scene":"corridor","characters":[],"speaker":"Итог","text":"Дети заняты, но ключ и материалы не найдены, и занятие под вопросом."},"E_FAIL":{"final":true,"outcome":"fail","bonus":0,"title":"Нарушена безопасность","scene":"corridor","characters":[],"speaker":"Итог","text":"Дети остались без присмотра или информация от организаторов скрыта. Это серьёзное нарушение."}},"meters":[],"flag_titles":{},"review":{"theory":[{"title":"Дети под присмотром — прежде всего","text":"Любое организационное решение начинается с вопроса: кто сейчас присматривает за детьми?"},{"title":"Игра как инструмент управления","text":"Игровая рамка удерживает группу без давления. Заранее готовьте 2–3 короткие игры на запасной случай."}],"takeaways":["Не оставляйте детей без присмотра.","Держите наготове короткие игры.","Сообщите организаторам письменно, если дозвониться не удаётся."],"node_notes":{"S1":"Сначала дети: любое решение начинается с вопроса, кто присматривает за группой, пока вы решаете проблему.","F_A":"Игра удержала детей, но решить проблему нужно без потери присмотра.","F_B":"Шум в коридоре стал новой проблемой. Просите помощи, а не боритесь с недовольством.","F_C":"Когда ситуация осложнилась, чёткий отчёт координатору помогает быстрее всего."},"final_notes":{"E_BEST":"Дети под присмотром, проблема решена.","E_GOOD":"Проблему решили с потерями.","E_WEAK":"Ситуация осталась нерешённой.","E_FAIL":"Безопасность нарушена."}}},{"slug":"vol-colleague-duty","title":"Коллега уходит обедать","description":"Вожатый на выездной смене в паре с опытным коллегой, который перекладывает обязанности и предлагает оставить детей без присмотра на 15 минут.","category":"Коллеги и администрация","difficulty":2,"duration_min":5,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"S1","nodes":{"S1":{"name":"Коллега уходит обедать","scene":"camp_yard","characters":[{"id":"colleague","mood":"neutral"}],"speaker":"Ситуация","text":"Вы вожатый на выездной смене в паре с более опытным коллегой. Он регулярно перекладывает свои обязанности: просит провести вечернее мероприятие вместо него, а сам уходит отдыхать. На возражения отвечает: «Ты новенький, тебе нужно выслуживаться, а у меня уже стаж». В очередной раз он предлагает оставить детей без присмотра на 15 минут, чтобы пойти пообедать. Что вы ответите?","choices":[{"id":"a","text":"Тайно пожаловаться координатору, ничего не сказав самому коллеге.","to":"F_C","scores":{"COM":-3,"ETH":-1},"feedback":"Жалоба за спиной без разговора разрушает рабочие отношения."},{"id":"b","text":"«По инструкции я не имею права оставаться с детьми один. Либо ты зовёшь подмену, либо мы никуда не уходим».","to":"F_B","scores":{"ETH":3,"COM":1,"TAC":1},"feedback":"Вы опираетесь на правила техники безопасности. Дети в безопасности, но отношения с коллегой пострадают."},{"id":"c","text":"«Конечно, иди. Только координатор сказал, что через 5 минут сделает обход и проверит, все ли взрослые на месте. Так что если что, я скажу, что ты пошёл обедать».","to":"F_A","scores":{"COM":2,"TAC":3,"ETH":1},"feedback":"Вы не спорите о правилах, а напоминаете о реальном последствии, и решение принимает сам коллега."},{"id":"d","text":"«Ребята, он хочет уйти, а мы останемся одни. Вы не против?»","to":"F_C","scores":{"ETH":-3,"TAC":-2},"feedback":"Вы перекладываете ответственность взрослого на детей."}]},"F_A":{"name":"Вечернее мероприятие","scene":"camp_yard","characters":[{"id":"colleague","mood":"neutral"}],"speaker":"Коллега","text":"Коллега ворчит: «Ладно, остаюсь. Но вечернее мероприятие всё равно проведёшь ты, новенькие обязаны».","choices":[{"id":"a","text":"«Давай честно: сегодня я, завтра ты, и запишем в общий график. Помогать готов, но не вместо тебя».","to":"E_BEST","scores":{"COM":2,"TAC":2,"ETH":1},"feedback":"Вы предлагаете правило, а не спорите о стаже."},{"id":"b","text":"«Ладно, проведу, но это в последний раз».","to":"E_GOOD","scores":{"COM":1,"TAC":-1},"feedback":"Вы уступаете, не договорившись о правилах."},{"id":"c","text":"«Тогда я скажу координатору, что ты отлыниваешь».","to":"E_WEAK","scores":{"COM":-2},"feedback":"Угроза жалобой вместо разговора."}]},"F_B":{"name":"Насмешка при детях","scene":"camp_yard","characters":[{"id":"colleague","mood":"neutral"}],"speaker":"Коллега","text":"Утром при детях коллега громко говорит: «А вот наш главный по инструкциям! Без него и шагу не ступить». Дети смеются.","choices":[{"id":"a","text":"Вечером наедине сказать: «Мне неприятно, когда ты так при детях. Давай договоримся о правилах дежурств».","to":"E_BEST","scores":{"COM":3,"EMP":1,"TAC":1},"feedback":"Прямой разговор без свидетелей и с конкретным предложением."},{"id":"b","text":"Ответить шуткой при детях и продолжить смену.","to":"E_GOOD","scores":{"TAC":1},"feedback":"Напряжение снято, но причина осталась."},{"id":"c","text":"Сделать вид, что ничего не заметили.","to":"E_WEAK","scores":{"COM":-1,"REF":-1},"feedback":"Молчание закрепляет такое отношение."}]},"F_C":{"name":"Планёрка у координатора","scene":"camp_yard","characters":[{"id":"coordinator","mood":"neutral"}],"speaker":"Координатор","text":"Утром координатор собирает вожатых: «Что вчера произошло?» Коллега смотрит на вас, дети уже что-то рассказали.","choices":[{"id":"a","text":"Честно рассказать, что произошло и в чём ваша ошибка, и предложить обсудить правила дежурств втроём.","to":"E_GOOD","scores":{"REF":3,"ETH":2,"COM":1},"feedback":"Признание своей роли помогает договориться."},{"id":"b","text":"Свалить всё на коллегу.","to":"E_FAIL","scores":{"ETH":-2,"COM":-2},"feedback":"Обвинения превращают разговор в разбирательство."},{"id":"c","text":"Отмолчаться.","to":"E_WEAK","scores":{"REF":-2,"COM":-1},"feedback":"Вопрос остаётся без решения."}]},"E_BEST":{"final":true,"outcome":"success","bonus":10,"title":"Договорились о правилах","scene":"camp_yard","characters":[],"speaker":"Итог","text":"С коллегой установлены понятные правила дежурств, дети под присмотром, отношения рабочие."},"E_GOOD":{"final":true,"outcome":"partial","bonus":7,"title":"Напряжение осталось","scene":"camp_yard","characters":[],"speaker":"Итог","text":"Опасных ситуаций нет, но отношения остаются натянутыми, и к вопросу придётся вернуться."},"E_WEAK":{"final":true,"outcome":"partial","bonus":2,"title":"Вопрос заморожен","scene":"camp_yard","characters":[],"speaker":"Итог","text":"Вы избежали открытого конфликта, но проблема с обязанностями не решена и вернётся."},"E_FAIL":{"final":true,"outcome":"fail","bonus":0,"title":"Конфликт в отряде","scene":"camp_yard","characters":[],"speaker":"Итог","text":"Отряд разделился, а атмосфера в смене стала тяжёлой."}},"meters":[],"flag_titles":{},"review":{"theory":[{"title":"Безопасность не обсуждается","text":"Оставлять детей без присмотра нельзя даже на 15 минут. Это базовое правило, а не вопрос «выслуживания»."},{"title":"Сначала разговор с коллегой","text":"Если коллега систематически перекладывает обязанности, сначала скажите ему прямо. К координатору идут открыто, а не за спиной."}],"takeaways":["Безопасность детей — вне торга.","Решайте с коллегой лично, а не за его спиной.","Не втягивайте детей в решения взрослых."],"node_notes":{"S1":"Безопасность детей не обсуждается. Сложность в том, как это сказать, не разрушив отношения.","F_A":"Коллега уступил, но проблема обязанностей осталась. Её решают правилом, а не обидой.","F_B":"Критику о неприятном отношении говорят наедине и конкретно.","F_C":"Когда ситуация вышла из-под контроля, честный рассказ и признание своей части возвращают вас в рабочий диалог."},"final_notes":{"E_BEST":"Вы не только защитили детей, но и договорились с коллегой.","E_GOOD":"Безопасность обеспечена, отношения требуют работы.","E_WEAK":"Проблема отложена.","E_FAIL":"Конфликт разрушил рабочие отношения."}}},{"slug":"vol-parent-video","title":"Родитель с телефоном на мастер-классе","description":"После открытого мастер-класса родитель при других родителях обвиняет студента в некомпетентности, снимает на телефон и угрожает жалобой администрации.","category":"Взаимодействие с родителями","difficulty":2,"duration_min":5,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"S1","nodes":{"S1":{"name":"Родитель с телефоном на мастер-классе","scene":"foyer","characters":[{"id":"parent","mood":"angry"}],"speaker":"Ситуация","text":"После открытого мастер-класса родитель при других родителях обвиняет вас, студента колледжа, в некомпетентности: вы «плохо объясняете» и «не имеете права работать с детьми». В ходе разговора он достаёт телефон, начинает снимать и угрожает пожаловаться администрации. Вокруг собираются люди. Как вы поступите?","choices":[{"id":"a","text":"«Я вас понимаю. Но я не имею полномочий решать этот вопрос. Давайте пройдём к администрации».","to":"F_B","scores":{"COM":2,"TAC":1,"ETH":1},"feedback":"Вы защищаете границы и не втягиваетесь в спор, но разговор без эмоционального шага может раздражить."},{"id":"b","text":"«А вы вообще следите за своим ребёнком? Может, проблема в нём, а не во мне?»","to":"F_C","scores":{"COM":-2,"ETH":-3},"feedback":"Ответные обвинения перед камерой — самый опасный вариант."},{"id":"c","text":"«Я вижу, вы хотите зафиксировать ситуацию. Давайте не будем тратить вашу память на телефоне, а прямо сейчас вместе напишем официальную претензию на имя руководителя с вашими требованиями».","to":"F_A","scores":{"COM":2,"TAC":3,"ETH":1},"feedback":"Вы переводите конфликт из эмоционального видео-формата в письменный и правовой, не споря и не оправдываясь."},{"id":"d","text":"«Посмотрите, я же никого не обижаю, остальные дети справились!»","to":"F_C","scores":{"TAC":-2,"EMP":-1},"feedback":"Вы оправдываетесь перед публикой и вовлекаете в спор остальных."}]},"F_A":{"name":"Родитель просит признать вину","scene":"foyer","characters":[{"id":"parent","mood":"neutral"}],"speaker":"Родитель","text":"Родитель опускает телефон: «Хорошо, давайте письменно. Но пишем так: „Студент признаёт, что плохо объяснял материал“. Подпишите, и я удалю видео».","choices":[{"id":"a","text":"«Я готов описать, что произошло на занятии, но признание вины подписывать не буду. Давайте зафиксируем факты и передадим руководителю вместе».","to":"E_BEST","scores":{"ETH":2,"COM":2,"TAC":2},"feedback":"Вы сохраняете границы и не закрываете диалог."},{"id":"b","text":"«Хорошо, подпишу, лишь бы всё закончилось».","to":"E_WEAK","scores":{"ETH":-3,"TAC":-2},"feedback":"Уступка под давлением: подпись станет аргументом против вас."},{"id":"c","text":"«Ничего подписывать не буду. Обращайтесь к руководителю сами».","to":"E_GOOD","scores":{"COM":-1,"ETH":1},"feedback":"Границы защищены, но вы закрываете возможность договориться."}]},"F_B":{"name":"В кабинете администратора","scene":"foyer","characters":[{"id":"admin","mood":"neutral"}],"speaker":"Администратор","text":"Вы пришли с родителем к администратору. Она спрашивает: «Что у вас случилось?» Родитель начинает первым и повышает голос, вы чувствуете, что сейчас придётся отвечать.","choices":[{"id":"a","text":"Спокойно изложить факты занятия без оценок и предложить родителю прийти на следующий мастер-класс.","to":"E_BEST","scores":{"COM":3,"TAC":1,"EMP":1},"feedback":"Факты вместо эмоций и приглашение вместо обороны."},{"id":"b","text":"Сказать, что родитель ведёт себя агрессивно и снимал детей.","to":"E_WEAK","scores":{"COM":-2,"TAC":-1},"feedback":"Вы отвечаете обвинением на обвинение."},{"id":"c","text":"Промолчать: пусть расскажет сам родитель.","to":"E_WEAK","scores":{"TAC":-1,"COM":-1},"feedback":"Рассказывать будет только одна сторона."}]},"F_C":{"name":"Видео попало в чат","scene":"foyer","characters":[{"id":"coordinator","mood":"neutral"}],"speaker":"Координатор","text":"Через час вам звонит координатор: «В родительский чат уже попало видео, родитель пишет жалобу. Что вы мне скажете?»","choices":[{"id":"a","text":"Коротко описать, что произошло, признать, что ответили резко, и предложить извиниться лично и встретиться втроём.","to":"E_GOOD","scores":{"REF":3,"ETH":2,"COM":1},"feedback":"Признание своей части ошибки возвращает вас в рабочий диалог."},{"id":"b","text":"Написать в родительский чат свою версию и оправдаться.","to":"E_FAIL","scores":{"COM":-2,"TAC":-2},"feedback":"Публичное оправдание раздувает конфликт."},{"id":"c","text":"Ничего не делать: само забудется.","to":"E_WEAK","scores":{"REF":-2,"TAC":-1},"feedback":"Проблема не исчезнет, а жалоба уже написана."}]},"E_BEST":{"final":true,"outcome":"success","bonus":10,"title":"Диалог в правовом русле","scene":"foyer","characters":[],"speaker":"Итог","text":"Конфликт оформлен как обращение к руководителю: факты зафиксированы, видео потеряло смысл. Родитель услышан, а вы сохранили и границы, и достоинство."},"E_GOOD":{"final":true,"outcome":"partial","bonus":7,"title":"Острая фаза позади","scene":"foyer","characters":[],"speaker":"Итог","text":"Конфликт утих, но осадок остался: родитель всё ещё недоволен, разговор с руководителем придётся продолжать."},"E_WEAK":{"final":true,"outcome":"partial","bonus":2,"title":"Вопрос не решён","scene":"foyer","characters":[],"speaker":"Итог","text":"Вы закрыли разговор уступкой или молчанием. Претензия никуда не делась и может вернуться жалобой."},"E_FAIL":{"final":true,"  входит в кабинет, не поздоровавшись: «Вы занижаете оценки моему сыну! Он дома всё знает, а у вас тройка!» Контрольная лежит на столе, красных пометок много.","choices":[{"id":"a","text":"Предложить сесть и спросить: «Расскажите, что вас тревожит».","to":"RA","scores":{"COM":2,"EMP":2},"feedback":"Открытый вопрос вместо защиты снижает накал и открывает разговор.","effects":{"P":1},"flags":["asked_open"]},{"id":"b","text":"Сразу ответить: «Оценка выставлена строго по критериям».","to":"ESC","scores":{"COM":-1,"TAC":1},"feedback":"Позиция верная, но без признания эмоций она звучит как отказ слушать.","effects":{"P":-1,"A":1},"flags":["defended"]},{"id":"c","text":"Признать эмоцию и предложить: «Давайте вместе посмотрим работу Макса».","to":"RC","scores":{"COM":2,"TAC":2,"EMP":1},"feedback":"Разбор конкретной работы переводит спор об «предвзятости» в разговор о фактах.","effects":{"P":1,"A":1},"flags":["looked_work"]},{"id":"d","text":"Быстро согласиться: «Хорошо, я пересмотрю оценку».","to":"CAVE","scores":{"ETH":-3,"TAC":-2},"feedback":"Уступка под давлением выглядит как слабость. Оценка перестаёт быть объективной.","effects":{"P":2,"A":-2},"flags":["caved"]}]},"RA":{"kind":"cut","scene":"office","characters":[{"id":"irina","mood":"sad"}],"speaker":"Мама Макса","text":"Мама переводит дыхание и впервые говорит не об оценке: «Макс дома тревожится и плачет перед контрольными. Я не знаю, что делать». Разговор стал другим.","set_flags":["know_anxiety"],"auto":[{"to":"M2"}]},"RC":{"kind":"cut","scene":"office","characters":[{"id":"irina","mood":"neutral"}],"speaker":"Ситуация","text":"Вы вместе читаете работу. Мама недоверчива, но видит: в задачах Макс теряет баллы не на вычислениях, а на условиях: пропускает слова и решает не то, что спрашивается. Дома он знает материал, а на контрольной торопится.","set_flags":["know_pattern"],"auto":[{"to":"M2"}]},"CAVE":{"kind":"cut","scene":"office","characters":[{"id":"irina","mood":"happy"}],"speaker":"Мама Макса","text":"Мама довол ,"effects":{"P":-2}},{"id":"c","text":"Согласиться пересмотреть оценку, чтобы закрыть вопрос.","to":"EPI","scores":{"ETH":-3,"TAC":-2},"feedback":"Оценку «закрывают» ради тишины, и критерии перестают работать.","effects":{"A":-2},"flags":["caved"]}]},"MEET2":{"kind":"cut","scene":"office","characters":[{"id":"irina","mood":"neutral"}],"speaker":"Ситуация","text":"Через два дня мама приходит снова. Она настороженна, но готова слушать. Вы начинаете с того, что вам важно, чтобы Максу было хорошо.","auto":[{"to":"M2","effects":{"P":1}}]},"M2":{"scene":"office","characters":[{"id":"irina","mood":"neutral"}],"speaker":"Ситуация","text":"Мама готова к содержательному разговору. Что вы делаете в первую очередь?","choices":[{"id":"a","text":"Разобрать работу Макса по критериям: показать, где потеряны баллы и почему.","to":"M3","scores":{"COM":2,"TAC":2},"feedback":"Конкретика заменяет споры: видно, что именно происходит с работой.","effects":{"P":1,"A":1},"flags":["know_pattern"]},{"id":"b","text":"Расспросить, как Макс ведёт себя дома перед контрольными.","to":"M3","scores":{"EMP":2,"COM":1},"feedback":"Вы узнаёте то, чего в работе не видно.","effects":{"P":1},"flags":["know_anxiety"]},{"id":"c","text":"Сразу дать общие рекомендации: «Нужно больше заниматься».","to":"M3","scores":{"COM":-1,"TAC":-1},"feedback":"Общие советы эмоционально пусты и не опираются ни на что.","effects":{"P":-1}},{"id":"d","text":"Предложить платные занятия с репетитором.","to":"M3","scores":{"ETH":-1,"COM":-1},"feedback":"Мама слышит «платите за то, что должна делать школа».","effects":{"P":-2},"flags":["push_tutor"]}]},"M3":{"scene":"office","characters":[{"id":"irina","mood":"neutral"}],"speaker":"Мама Макса","text":"«Хорошо. А что нам делать, чтобы дело пошло лучше?»","choices":[{"id":"a","text":"Дать конкретный план: на чём именно Макс теряет баллы, 10 минут в день на разбор условий, короткая проверка через неделю.","to":"M3b","scores":{"TAC":3,"COM":2},"feedback":"План опирается на то, что ви , контакты и дата следующего контакта превращают встречу в процесс."}],"node_notes":{"P1":"Первые слова задают тон. Вопрос и совместный разбор работы снижают напряжение лучше защиты. Уступка сразу портит всё остальное.","ESC":"Если вы начали с защиты, шанс вернуться есть: признайте эмоции и переведите разговор на ребёнка.","DIR":"Перед директором работают факты и готовность к диалогу, а не обвинения.","M2":"Какую информацию вы получите сейчас, определит, какие варианты вам будут доступны дальше.","M3":"План возможен, только если вы разобрали работу. Иначе остаются общие слова.","M3b":"Помощь по тревоге доступна, только если вы узнали о ней.","M4":"Фиксация договорённостей и дата следующего контакта закрепляют результат."},"final_notes":{"E_PART":"Лучший исход: доверие, знание причины, план и поддержка.","E_PLAN":"Хороший исход. Не хватило второй части помощи или записи договорённостей.","E_NONE":"Пока нет плана и записи, вернётся то же.","E_BREAK":"Доверие потеряно.","E_CAVED":"Уступка превратила оценку в предмет торга.","E_REP":"Обвинения в адрес родителя перед администрацией."},"takeaways":["Сначала услышьте, потом объясняйте: тревога родителя обычно важнее самой оценки.","Разбирайте работу вместе: конкретика снимает подозрение в предвзятости.","Не уступайте оценку под давлением, но и не защищайтесь.","Договорённости записывайте и назначайте следующий контакт."]}},{"slug":"vol-child-secret","title":"Секрет, который нельзя хранить","description":"После занятия ребёнок делится семейной проблемой, угрожающей его безопасности, и просит никому не говорить.","category":"Профессиональные дилеммы","difficulty":3,"duration_min":8,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"S1","nodes":{"S1":{"name":"Секрет, который нельзя хранить","scene":"classroom_after","characters":[{"id":"student_a","mood":"sad"}],"speaker":"Ситуация","text":"После занятия ребёнок делится с вами семейной проблемой, которая может угрожать его безопасности. Он просит никому не рассказывать. :"Вы не спасатель","text":"Ваша роль — выслушать, не осуждать и передать дальше. Самостоятельные разговоры с обидчиком опасны для ребёнка."}],"takeaways":["Не обещайте сохранить тайну.","Дайте ребёнку выбор, как именно передать информацию.","Передайте специалисту сразу."],"node_notes":{"S1":"Любое решение здесь начинается с вопроса, как сохранить и доверие, и безопасность.","S2":"Закрытый вариант откроется, только если вы были честны с ребёнком на первом шаге.","S2D":"Самостоятельное решение не помогло. Остаётся возможность признать ошибку и обратиться к специалисту.","S3":"Ребёнок проверяет, можно ли вам доверять. Честный ответ важнее удобного."},"final_notes":{"E_BEST":"Вы не обещали тайну, были честны с ребёнком и передали факты специалисту.","E_GOOD":"Помощь организована, но доверие пострадало.","E_WEAK":"Специалист подключён, но ребёнок потерял доверие.","E_FAIL":"Ситуация осталась без внимания взрослых."}}},{"slug":"inclusion-day","title":"Инклюзивный день: четыре решения","description":"Один день смены в инклюзивной группе: новый ребёнок с протезом, сенсорная перегрузка, тревожная мама и квест без пандуса. Выборы накапливаются, и правило, которое вы задаёте утром, меняет возможности вечером.","category":"Инклюзия","difficulty":4,"duration_min":15,"competencies":["COM","EMP","TAC","ETH","REF"],"start":"E1","nodes":{"E1":{"name":"Новый мальчик в отряде","scene":"camp_yard","characters":[{"id":"timur","mood":"sad"}],"speaker":"Ситуация","text":"Вы волонтёр на дневной смене для детей 8–10 лет. Сегодня в отряд пришёл новый мальчик, Тимур: у него протез правой руки. Пока вы собираете отряд, дети начинают шептаться, показывать пальцем и смеяться, а двое отказываются вставать с ним в пару. Тимур делает вид, что ничего не замечает, но краснеет. Что вы сделаете?","choices":[{"id":"a","text":"«Он больной, особенный, поэтому вы должны во всём ему уступать и жалеть его».","to":"C1R","scores":{"EMP":-1,"ETH":-1},"feedback":"Жалость делает ребёнка «другим» и закрепляет превосходство группы.","effects":{"S":-1,"T":-1}},{"id":"b","text":"«Ребята, я вижу, вам интересно. У нас правило: если что-то непонятно, спрашиваем прямо, но только с разрешения человека. А теперь сыграем: наденем варежки и попробуем сделать привычные вещи по-другому».","to":"C1B","scores":{"EMP":2,"COM":2,"TAC":2},"feedback":"Любопытство получает безопасную форму, а страх превращается в интерес.","effects":{"S":1,"T":1},"flags":["asked_ok"]},{"id":"c","text":"«Не обращайте внимания, просто играйте».","to":"C1W","scores":{"TAC":-3,"ETH":-2},"feedback":"Если проигнорировать ситуацию, группа решает её сама, чаще всего травлей.","effects":{"S":-2,"T":-2},"flags":["harm"]},{"id":"d","text":"Резко прекратить смех и провести короткую беседу: «У нас так не принято. Все люди разные. Если ещё раз увижу смешки, поговорим с родителями».","to":"C1O","scores":{"ETH":1,"TAC":1,"COM":1},"feedback":"Смех остановлен, но через запрет, а не через понимание."}]},"C1B":{"kind":"cut","name":"Последствия","scene":"camp_yard","characters":[{"id":"timur","mood":"happy"}],"speaker":"Последствия","text":"Вы снимаете напряжение и превращаете страх в эмпатию. Тимур чувствует поддержку, а не жалость. Дети уже сами предлагают встать с ним в пару.","auto":[{"to":"E2"}]},"C1O":{"kind":"cut","name":"Последствия","scene":"camp_yard","characters":[{"id":"timur","mood":"sad"}],"speaker":"Последствия","text":"Внешне конфликт утихает, но дети могут затаить злость и начать травить Тимура исподтишка.","auto":[{"to":"E2"}]},"C1R":{"kind":"cut","name":"Последствия","scene":"camp_yard","characters":[{"id":"timur","mood":"sad"}],"speaker":"Последствия","text":"Группа чувствует превосходство, а у Тимура формируется роль жертвы. Здоровые отношения в отряде не складываются.","auto":[{"to":"E2"}]},"C1W":{"kind":"cut","name":"Последствия","scene":"camp_yard","characters":[{"id":"timur","mood":"sad"}],"speaker":"Последствия","text":"Атмосфера токсичности сохраняется. Тимур становится объектом насмешек, а вы теряете контроль над группой.","auto":[{"to":"E2"}]},"E2":{"name":"Шумный мастер-класс","scene":"masterclass","characters":[{"id":"yarik","mood":"sad"}],"speaker":"Ситуация","text":"После обеда проходит мастер-класс по барабанам под громкую музыку. Ярик, мальчик с РАС (расстройством аутистического спектра), вдруг закрывает уши руками, начинает раскачиваться и громко кричать. Остальные дети пугаются и замолкают. У вас нет специального образования, ассистента рядом нет. Что вы сделаете?","choices":[{"id":"a","text":"Взять Ярика за руку или обнять: «Тише-тише, всё хорошо, пойдём со мной».","to":"C2R","scores":{"EMP":-1,"TAC":-1},"feedback":"Прикосновение без разрешения для многих детей с РАС усиливает перегрузку.","effects":{"S":-1,"T":-1}},{"id":"b","text":"Выключить музыку, говорить максимально тихо и показать жестом на выход: «Давай выйдем в коридор, там тише».","to":"C2B","scores":{"EMP":3,"TAC":2,"ETH":1},"feedback":"Вы убираете источник стресса и оставляете выбор за ребёнком.","effects":{"S":1,"T":1}},{"id":"c","text":"Прикрикнуть, чтобы он замолчал, или попросить родителей забрать его с занятия.","to":"C2W","scores":{"ETH":-3,"EMP":-3},"feedback":"Публичное унижение и отстранение вместо помощи.","effects":{"S":-2,"T":-2},"flags":["harm"]},{"id":"d","text":"Не трогать Ярика, продолжить занятие и дать ему безопасное пространство: «Мы сейчас рисуем, а Ярик пока посидит и отдохнёт».","to":"C2O","scores":{"TAC":1,"EMP":1,"COM":1},"feedback":"Группа не сбивается, но источник стресса остался."}]},"C2B":{"kind":"cut","name":"Последствия","scene":"corridor","characters":[{"id":"yarik","mood":"neutral"}],"speaker":"Последствия","text":"Вы убираете источник стресса, Ярик успокаивается, а группа продолжает работать в тишине, пока вы сидите с ним рядом.","auto":[{"to":"E3"}]},"C2O":{"kind":"cut","name":"Последствия","scene":"masterclass","characters":[{"id":"yarik","mood":"sad"}],"speaker":"Последствия","text":"Группа не сбивается с ритма, но Ярик остаётся в стрессе, а вы не выполняете задачу по его включению.","auto":[{"to":"E3"}]},"C2R":{"kind":"cut","name":"Последствия","scene":"masterclass","characters":[{"id":"yarik","mood":"sad"}],"speaker":"Последствия","text":"Для многих детей с РАС тактильный контакт без разрешения является триггером: крик усиливается, и вы можете получить физический отпор.","auto":[{"to":"E3"}]},"C2W":{"kind":"cut","name":"Последствия","scene":"masterclass","characters":[{"id":"yarik","mood":"sad"}],"speaker":"Последствия","text":"Публичное унижение, глубокая травма для ребёнка, жалоба от родителей и обвинение в дискриминации.","auto":[{"to":"E3"}]},"E3":{"name":"Мама просит не включать Макса в игру","scene":"gym","characters":[{"id":"max_mom","mood":"neutral"},{"id":"max","mood":"neutral"}],"speaker":"Ситуация","text":"Перед активной игрой «Эстафета» к вам подходит мама Макса, мальчика с нарушением опорно-двигательного аппарата, который ходит с ходунками. Она говорит: «Он не будет бегать с остальными. Он просто посидит в стороне, чтобы не упал. Вы за него не отвечаете». Что вы ответите?","choices":[{"id":"a","text":"Согласиться с мамой, но попросить её остаться рядом с Максом и помочь ему включиться в игру в качестве наблюдателя.","to":"C3O","scores":{"COM":1,"EMP":1,"ETH":1},"feedback":"Безопасность обеспечена, но Макс остаётся наблюдателем."},{"id":"b","text":"«Хорошо, он будет сидеть в коридоре, в углу, до конца занятия».","to":"C3W","scores":{"ETH":-3,"TAC":-2},"feedback":"Это не инклюзия, а сегрегация.","effects":{"S":-2,"T":-2},"flags":["harm"]},{"id":"c","text":"«Я понимаю ваши переживания. Бегать он не будет, но может быть судьёй и записывать результаты остальных на планшете».","to":"C3B","scores":{"COM":3,"EMP":2,"TAC":1},"feedback":"Вы принимаете тревогу мамы и предлагаете роль, а не изоляцию.","effects":{"S":1,"T":1}},{"id":"d","text":"Присесть рядом с Максом и спросить его самого: «Как ты хочешь участвовать в эстафете?» Затем вместе с ним и мамой выбрать роль.","to":"C3A","scores":{"ETH":3,"COM":2,"EMP":2},"feedback":"Решение принимает сам ребёнок: вы продолжаете правило отряда.","effects":{"S":1,"T":1},"requires":{"flag":"asked_ok"},"hint":"Вспомните утро: в отряде договорились сначала спрашивать человека, и только с его разрешения."},{"id":"e","text":"Настоять: «У нас инклюзивная группа, он должен играть со всеми на равных».","to":"C3R","scores":{"COM":-1,"TAC":-1},"feedback":"Принцип без учёта безопасности и тревоги семьи вызывает конфликт.","effects":{"S":-1,"T":-1}}]},"C3B":{"kind":"cut","name":"Последствия","scene":"gym","characters":[{"id":"max","mood":"happy"}],"speaker":"Последствия","text":"Макс не изолирован, он полноценный участник процесса в безопасной для себя роли, а мама успокаивается.","auto":[{"to":"E4"}]},"C3A":{"kind":"cut","name":"Последствия","scene":"gym","characters":[{"id":"max","mood":"happy"}],"speaker":"Последствия","text":"Макс сам выбирает роль судьи. Мама видит, что сына спросили и услышали, а Макс впервые за смену улыбается.","auto":[{"to":"E4"}]},"C3O":{"kind":"cut","name":"Последствия","scene":"gym","characters":[{"id":"max","mood":"sad"}],"speaker":"Последствия","text":"Макс в безопасности, но лишён общения со сверстниками и чувствует себя не таким, как все.","auto":[{"to":"E4"}]},"C3R":{"kind":"cut","name":"Последствия","scene":"gym","characters":[{"id":"max","mood":"sad"}],"speaker":"Последствия","text":"Риск физической травмы, паника у Макса и огромный конфликт с мамой, которая может забрать его с занятий насовсем.","auto":[{"to":"E4"}]},"C3W":{"kind":"cut","name":"Последствия","scene":"gym","characters":[{"id":"max","mood":"sad"}],"speaker":"Последствия","text":"Это сегрегация: вы нарушаете право ребёнка на образование и досуг.","auto":[{"to":"E4"}]},"E4":{"name":"Квест без пандуса","scene":"mansion_hall","characters":[{"id":"dasha","mood":"neutral"},{"id":"admin","mood":"neutral"}],"speaker":"Ситуация","text":"Вечером вся группа едет на квест в старинный особняк. Выясняется, что маршрут включает только лестницы, а в группе есть Даша, девочка на коляске. Администрация площадки разводит руками: «Пандуса нет». Что вы сделаете?","choices":[{"id":"a","text":"Отменить квест для всех: «Извините, мы не знали про лестницы, поэтому никуда не идём».","to":"C4W","scores":{"TAC":-3,"COM":-2},"feedback":"Вы наказываете всю группу за недоработку организаторов, а виноватой окажется Даша.","effects":{"S":-2,"T":-2},"flags":["harm"]},{"id":"b","text":"Разделить роли: «Мы делимся на две команды. Одна идёт по маршруту, вторая (вместе с Дашей) остаётся в холле и становится штабом. Мы присылаем задания по телефону, а вы координируете наши действия».","to":"C4B","scores":{"TAC":3,"EMP":1,"ETH":2},"feedback":"Никто не исключён, у Даши важная роль в безопасной среде.","effects":{"S":1,"T":1}},{"id":"c","text":"Сказать: «Давайте поможем Даше и понесём коляску на руках».","to":"C4O","scores":{"EMP":1,"ETH":1,"TAC":1},"feedback":"Дети сплотятся, но это опасно: есть риск уронить Дашу.","effects":{"S":1,"T":-1}},{"id":"d","text":"Спросить Дашу, как она хочет участвовать, и вместе с ней и ребятами придумать роль для квеста.","to":"C4A","scores":{"ETH":3,"COM":2,"EMP":2},"feedback":"Решение принимает сама Даша, и роль подходит именно ей.","effects":{"S":1,"T":1},"requires":{"flag":"asked_ok"},"hint":"Вспомните утро: в отряде договорились сначала спрашивать человека, и только с его разрешения."},{"id":"e","text":"Отправить Дашу с сопровождающим ждать в кафе, пока остальные проходят квест.","to":"C4R","scores":{"ETH":-2},"feedback":"Даша чувствует себя обузой, а вы нарушаете принципы инклюзии.","effects":{"S":-2,"T":-2},"flags":["harm"]}]},"C4B":{"kind":"cut","name":"Последствия","scene":"mansion_hall","characters":[{"id":"dasha","mood":"happy"}],"speaker":"Последствия","text":"Никто не исключён из процесса, квест продолжается, а Даша получает важную и интересную роль в безопасной среде.","auto":[{"to":"F1"}]},"C4A":{"kind":"cut","name":"Последствия","scene":"mansion_hall","characters":[{"id":"dasha","mood":"happy"}],"spea  };

  (function () {

    al.forEach(r0 => al.forEach(c0 => {
      if ((r0 === 6 && c0 === 6) || (r0 === 6 && c0 === n - 7) || (r0 === n - 7 && c0 === 6)) return;
      for (let r = -2; r <= 2; r++) for (let c = -2; c <= 2; c++)
        set(r0 + r, c0 + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
    }));

    set(n - 8, 8, 1);                                       // тёмный модуль
    for (let i = 0; i < 9; i++) {                           // зоны формата
      if (!fn[8][i]) set(8, i, 0);
      if (!fn[i][8]) set(i, 8, 0);
    }
    for (let i = 0; i < 8; i++) { if (!fn[8][n - 1 - i]) set(8, n - 1 - i, 0); if (!fn[n - 1 - i][8]) set(n - 1 - i, 8, 0); }

    // данные зигзагом
    const words = codewords(str, ver, lvl);
    const bits = [];
    words.forEach(w => { for (let i = 7; i >= 0; i--) bits.push((w >> i) & 1); });
    for (let i = 0; i < REMAINDER[ver]; i++) bits.push(0);
    let bi = 0, up = true;
    for (let c = n - 1; c > 0; c -= 2) {
      if (c === 6) c--;                                     // пропуск столбца синхронизации
      for (let k = 0; k < n; k++) {
        const r = up ? n - 1 - k : k;
        for (const cc of [c, c - 1]) {
          if (fn[r][cc]) continue;
          mat[r][cc] = bi < bits.length ? bits[bi++] : 0;
        }
      }
      up = !up;
    }

    // маски
    const MASKS = [
      (r, c) => (r + c) % 2 === 0,
      (r, c) => r % 2 === 0,
      (r, c) => c % 3 === 0,
      (r, c) => (r + c) % 3 === 0,
      (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
      (r, c) => ((r * c) % 2 + (r * c) % 3) === 0,
      (r, c) => (((r * c) % 2 + (r * c) % 3) % 2) === 0,
      (r, c) => (((r + c) % 2 + (r * c) % 3) % 2) === 0,
    ];
    let bestM = 0, bestP = Infinity, bestG = null;
    for (let m = 0; m < 8; m++) {
      const g = mat.map((row, r) => row.map((v, c) => fn[r][c] ? v : (MASKS[m](r, c) ? v ^ 1 : v)));
      fmtInto(g, n, m, lvl);
      const p = penalty(g, n);
      if (p < bestP) { bestP = p; bestM = m; bestG = g; }
    }
    return { size: n, version: ver, level: lvl, mask: bestM, modules: bestG };
  }

  /* Остаток от деления на порождающий полином: ecBits — степень полинома. */
  function bch(data, poly, ecBits) {
    let rem = data;
    for (let i = 0; i < ecBits; i++) rem = (rem << 1) ^ (((rem >>> (ecBits - 1)) & 1) * poly);
    return (data << ecBits) | rem;
  }
  function fmtInto(g, n, mask, lvl) {
    const bits = bch((ECI[lvl] << 3) | mask, 0x537, 10) ^ 0x5412;
    const get = i => (bits >> (14 - i)) & 1;   // старший бит — в (8,0), как в стандарте
    for (let i = 0; i <= 5; i++) g[8][i] = get(i);
    g[8][7] = get(6); g[8][8] = get(7); g[7][8] = get(8);
    for (let i = 9; i <= 14; i++) g[14 - i][8] = get(i);
    for (let i = 0; i <= 6; i++) g[n - 1 - i][8] = get(i);
    for (let i = 7; i <= 14; i++) g[8][n - 15 + i] = get(i);
    g[n - 8][8] = 1;                           // всегда тёмный модуль
  }

  function penalty(g, n) {
    let p = 0;
    const runs = line => {
      let s = 0, prev = -1, run = 0;
      for (const v of line) {
        if (v === prev) run++;
        else { if (run >= 5) s += run - 2; prev = v; run = 1; }
      }
      if (run >= 5) s += run - 2;
      return s;
    };
    for (let r = 0; r < n; r++) p += runs(g[r]);
    for (let c = 0; c < n; c++) p += runs(g.map(row => row[c]));
    for (let r = 0; r < n - 1; r++) for (let c = 0; c < n - 1; c++) {
      const v = g[r][c];
      if (v === g[r][c + 1] && v === g[r + 1][c] && v === g[r + 1][c + 1]) p += 3;
    }
    const pat = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0], rev = pat.slice().reverse();
    const hit = (line, i, q) => q.every((v, j) => line[i + j] === v);
    for (let r = 0; r < n; r++) for (let c = 0; c + 11 <= n; c++) {
      if (hit(g[r], c, pat) || hit(g[r], c, rev)) p += 40;
    }
    for (let c = 0; c < n; c++) {
      const col = g.map(row => row[c]);
      for (let r = 0; r + 11 <= n; r++) if (hit(col, r, pat) || hit(col, r, rev)) p += 40;
    }
    let dark = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) dark += g[r][c];
    p += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
    return p;
  }

  function svg(str, opts) {
    const o = opts || {}, q = o.border === undefined ? 4 : o.border;
    const { size, modules } = build(str, o.level);
    const dim = size + q * 2;
    let d = "";
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (modules[r][c]) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + dim + ' ' + dim +
      '" shape-rendering="crispEdges" role="img" aria-label="QR-код со ссылкой на сайт">' +
      '<rect width="' + dim + '" height="' + dim + '" fill="' + (o.light || "#fff") + '"/>' +
      '<path fill="' + (o.dark || "#000") + '" d="' + d + '"/></svg>';
  }

  return { build, svg, SPEC };
})();

<script>
/* Движок кейсов v2 в браузере: порт app/engine.py (условия, шкалы, флаги, роутеры, оптимум). */
const OUTCOME_TITLES = { success: "Успех", partial: "Частичный результат", fail: "Неудача" };
const RATING_TITLES = { best: "Оптимальный выбор", good: "Приемлемо", weak: "Слабый выбор" };
const GOOD_GAP = 3;
const NEXT = "next";

function nodeKind(n) {
  if (n.final) return "final";
  return (n.kind === "cut" || n.kind === "router") ? n.kind : "scene";
}
function choiceTotal(ch) {
  let s = 0;
  for (const v of Object.values(ch.scores || {})) s += (v | 0);
  return s;
}

class Engine {
  constructor(graph) {
    this.g = graph;
    this.nodes = graph.nodes;
    this.meters = graph.meters || [];
    this.codes = this.meters.map(m => m.code);
    this.idx = {};
    this.codes.forEach((c, i) => { this.idx[c] = i; });
    this.lo = this.meters.map(m => (m.min === undefined ? -3 : m.min | 0));
    this.hi = this.meters.map(m => (m.max === undefined ? 3 : m.max | 0));
    this.memo = new Map();
    this.active = new Set();
  }
  initial() {
    return { m: this.meters.map(m => (m.start === undefined ? 0 : m.start | 0)), f: [] };
  }
  key(nid, st) { return nid + "\u0001" + st.m.join(",") + "\u0001" + st.f.join(","); }

  holds(cond, st) {
    if (cond === null || cond === undefined) return true;
    if (cond.all) return cond.all.every(c => this.holds(c, st));
    if (cond.any) return cond.any.some(c => this.holds(c, st));
    if (cond.not) return !this.holds(cond.not, st);
    if (cond.flag !== undefined) return st.f.indexOf(cond.flag) >= 0;
    const v = st.m[this.idx[cond.meter]];
    if (cond.gte !== undefined) return v >= cond.gte;
    if (cond.lte !== undefined) return v <= cond.lte;
    return v === cond.eq;
  }
  apply(st, effects, flags) {
    const m = st.m.slice();
    for (const [code, d] of Object.entries(effects || {})) {
      const i = this.idx[code];
      m[i] = Math.max(this.lo[i], Math.min(this.hi[i], m[i] + (d | 0)));
    }
    let f = st.f;
    if (flags && flags.length) {
      const s = new Set(f);
      flags.forEach(x => s.add(x));
      f = Array.from(s).sort();
    }
    return { m, f };
  }
  enter(nid, st) { return this.apply(st, null, this.nodes[nid].set_flags); }
  pick(node, st) {
    for (const e of node.auto) if (this.holds(e.if, st)) return e;
    throw new Error("Ни одно условие роутера не сработало.");
  }
  advance(nid, st) {
    st = this.enter(nid, st);
    for (let i = 0; i < 100; i++) {
      const node = this.nodes[nid];
      if (nodeKind(node) !== "router") return [nid, st];
      const e = this.pick(node, st);
      st = this.apply(st, e.effects, e.flags);
      nid = e.to;
      st = this.enter(nid, st);
    }
    throw new Error("Слишком длинная цепочка роутеров.");
  }
  available(ch, st) { return this.holds(ch.requires, st); }

  take(nid, st, choiceId) {
    const node = this.nodes[nid], kind = nodeKind(node);
    if (kind === "scene") {
      const ch = node.choices.find(c => c.id === choiceId);
      if (!ch || !this.available(ch, st)) throw new Error("Такого варианта нет или он пока закрыт.");
      const [nxt, st3] = this.advance(ch.to, this.apply(st, ch.effects, ch.flags));
      return [nxt, st3, ch];
    }
    if (kind === "cut" && choiceId === NEXT) {
      const e = this.pick(node, st);
      const [nxt, st3] = this.advance(e.to, this.apply(st, e.effects, e.flags));
      return [nxt, st3, null];
    }
    throw new Error("Из этого узла нельзя сделать такой шаг.");
  }
  start() { return this.advance(this.g.start, this.initial()); }

  // --- оптимум: [лучшая сумма, худшая сумма, число путей, множество финалов]
  solve(nid, st) {
    const k = this.key(nid, st);
    const hit = this.memo.get(k);
    if (hit) return hit;
    if (this.active.has(k)) throw new Error("Зацикливание в узле " + nid + ".");
    this.active.add(k);
    try {
      const res = this.solveInner(nid, st);
      this.memo.set(k, res);
      return res;
    } finally { this.active.delete(k); }
  }
  solveInner(nid, st) {
    const node = this.nodes[nid], kind = nodeKind(node);
    if (kind === "final") {
      const b = node.bonus | 0;
      return [b, b, 1, new Set([nid])];
    }
    if (kind === "cut") {
      const e = this.pick(node, st);
      const [nxt, st3] = this.advance(e.to, this.apply(st, e.effects, e.flags));
      return this.solve(nxt, st3);
    }
    let best = null, worst = null, cnt = 0, open = false;
    const ends = new Set();
    for (const ch of node.choices) {
      if (!this.available(ch, st)) continue;
      open = true;
      const [nxt, st3] = this.advance(ch.to, this.apply(st, ch.effects, ch.flags));
      const [b, w, c, e] = this.solve(nxt, st3);
      const pts = choiceTotal(ch);
      best = best === null ? b + pts : Math.max(best, b + pts);
      worst = worst === null ? w + pts : Math.min(worst, w + pts);
      cnt += c;
      e.forEach(x => ends.add(x));
    }
    if (!open) throw new Error("Тупик в узле " + nid + ".");
    return [best, worst, cnt, ends];
  }
  bestHere(nid, st) { return this.solve(nid, st)[0]; }
  choiceValue(nid, st, ch) {
    const [nxt, st3] = this.advance(ch.to, this.apply(st, ch.effects, ch.flags));
    return choiceTotal(ch) + this.solve(nxt, st3)[0];
  }
  bestChoice(nid, st) {
    let bv = null, bc = null;
    for (const ch of this.nodes[nid].choices) {
      if (!this.available(ch, st)) continue;
      const v = this.choiceValue(nid, st, ch);
      if (bv === null || v > bv) { bv = v; bc = ch; }
    }
    return bc;
  }
  rate(nid, st, ch) {
    const gap = this.bestHere(nid, st) - this.choiceValue(nid, st, ch);
    if (gap <= 0) return "best";
    return gap <= GOOD_GAP ? "good" : "weak";
  }
}

function analyze(graph, eng) {
  eng = eng || new Engine(graph);
  let [nid, st] = eng.start();
  const [best, worst, paths, ends] = eng.solve(nid, st);
  const byComp = {};
  (graph.competencies || []).forEach(c => { byComp[c] = 0; });
  const golden = [];
  while (nodeKind(graph.nodes[nid]) !== "final") {
    if (nodeKind(graph.nodes[nid]) === "scene") {
      const ch = eng.bestChoice(nid, st);
      golden.push({ node: nid, choice: ch.id });
      for (const [c, v] of Object.entries(ch.scores || {})) byComp[c] = (byComp[c] || 0) + (v | 0);
      [nid, st] = eng.take(nid, st, ch.id);
    } else {
      [nid, st] = eng.take(nid, st, NEXT);
    }
  }
  return { best_total: best, worst_total: worst, path_count: paths,
           golden_path: golden, golden_final: nid, golden_by_comp: byComp,
           reachable_finals: Array.from(ends).sort() };
}

/* Округление «половина к чётному», как round() в Python: проценты совпадают с серверной версией. */
function roundHalfEven(x) {
  const f = Math.floor(x), d = x - f;
  if (d > 0.5) return f + 1;
  if (d < 0.5) return f;
  return f % 2 === 0 ? f : f + 1;
}

function starsFor(pct, outcome) {
  if (outcome === "fail") return pct >= 0.25 ? 1 : 0;
  let s = pct >= 0.85 ? 3 : pct >= 0.6 ? 2 : pct >= 0.3 ? 1 : 0;
  if (outcome === "partial") s = Math.min(s, 2);
  return s;
}

/* Итоги по списку шагов [{node_id, choice_id}] — порт summarize(). */
function summarize(graph, ana, steps, finalId, eng) {
  eng = eng || new Engine(graph);
  const comps = graph.competencies || [];
  const byComp = {};
  comps.forEach(c => { byComp[c] = 0; });
  const path = [], trace = [], counts = { best: 0, good: 0, weak: 0 };
  let earned = 0;
  let [nid, st] = eng.start();
  for (const s of steps) {
    const node = graph.nodes[nid];
    if (s.node_id !== nid) throw new Error("История попытки не совпадает с кейсом.");
    if (nodeKind(node) === "scene") {
      const ch = node.choices.find(c => c.id === s.choice_id);
      const rating = eng.rate(nid, st, ch);
      const bestCh = eng.bestChoice(nid, st);
      const pts = choiceTotal(ch);
      earned += pts;
      for (const [c, v] of Object.entries(ch.scores || {})) byComp[c] = (byComp[c] || 0) + (v | 0);
      counts[rating]++;
      const [nxt, st2] = eng.take(nid, st, s.choice_id);
      const after = {};
      eng.codes.forEach((c, i) => { after[c] = st2.m[i]; });
      path.push({ node_id: nid, situation: node.text || "", choice_id: ch.id, choice_text: ch.text,
                  points: pts, rating, feedback: ch.feedback || "",
                  best_id: bestCh.id, best_text: bestCh.text, scores: ch.scores || {},
                  effects: ch.effects || {}, meters_after: after });
      trace.push(after);
      nid = nxt; st = st2;
    } else {
      [nid, st] = eng.take(nid, st, s.choice_id);
    }
  }
  const bonus = graph.nodes[finalId].bonus | 0;
  earned += bonus;
  const bestTotal = ana.best_total || 1;
  const pct = Math.min(Math.max(0, earned) / bestTotal, 1);
  const outcome = graph.nodes[finalId].outcome;
  const compRows = comps.map(c => {
    const mx = ana.golden_by_comp[c] || 0;
    const got = Math.max(0, byComp[c] || 0);
    return { code: c, earned: got, max: mx, pct: mx > 0 ? roundHalfEven(Math.min(got / mx, 1) * 100) : null };
  });
  const flags = Object.entries(graph.flag_titles || {}).sort()
    .filter(([f, t]) => st.f.indexOf(f) >= 0 && t).map(([f, t]) => t);
  return { earned, bonus, best_total: ana.best_total, pct, stars: starsFor(pct, outcome),
           outcome, counts, competencies: compRows, path,
           meters: eng.meters.map((m, i) => ({ code: m.code, title: m.title || m.code,
             value: st.m[i], min: eng.lo[i], max: eng.hi[i] })),
           trace, flags };
}

}
function position(slug, steps) {              // текущий узел и состояние по списку шагов

}
const stars = n => '<span class="stars">' + [1, 2, 3].map(i =>

function plural(n, a, b, c) {
  const m10 = n % 10, m100 = n % 100;

  if (!st.name) {

      '<label class="f" for="nm">Фамилия и имя<input type="text" id="nm" autocomplete="name" placeholder="Иванов Иван"></label>' +
      '<label class="f" for="gr">Группа<input type="text" id="gr" placeholder="К2083-26"></label>' +
      '<button class="btn sm ghost" id="saveme" style="align-self:flex-start">Сохранить</button></div>';
  }
  return out;
}

// ---------- карточка кейса
function vCase() {
  const c = BY_SLUG[st.slug], d = st.done[c.slug];
  const { ana } = engine(c.slug);
  const comps = c.competencies.map(k => esc(COMP[k] || k)).join(", ");
  const unfinished = st.steps.length > 0;
  return topLine() + nav() + '<div class="col"><h1>' + esc(c.title) + "</h1>" +
    '<div class="tags"><span class="tag">' + esc(c.category) + '</span><span class="tag">' +
    stars(Math.min(c.difficulty, 3)) + (c.difficulty > 3 ? " сложный" : "") + '</span><span class="tag">' +
    c.duration_min + " мин</span></div></div>" +
    '<div class="panel col"><p>' + esc(c.description) + "</p>" +
    '<p class="small muted">Компетенции: ' + comps + "</p>" +
    '<p class="small muted">Развилок в кейсе: ' + ana.golden_path.length + ", путей: " + ana.path_count + ".</p>" +
    (d ? '<p class="small">Лучший результат: ' + stars(d.stars) + " " + Math.round(d.pct * 100) + "% · " +
      esc(OUTCOMES[d.outcome]) + "</p>" : "") + "</div>" +
    '<div class="row">' + (unfinished ? '<button class="btn" id="resume">Продолжить</button>' : "") +
    '<button class="btn' + (unfinished ? " ghost" : "") + '" id="play">' +
    (unfinished ? "Начать заново" : d ? "Пройти ещё раз" : "Начать кейс") + "</button>" +
    '<button class="btn ghost" data-go="cases">К списку</button></div>';
}

// ---------- прохождение
function vPlay() {
  const c = BY_SLUG[st.slug];
  let pos;
  try { pos = position(st.slug, st.steps); }
  catch (e) { st.steps = []; pos = position(st.slug, st.steps); }
  const { nid, s, node, g, eng } = pos;
  if (node.final) return vFinal(nid);          // на случай возврата к завершённой попытке
  const { ana } = engine(st.slug);
  const total = Math.max(ana.golden_path.length, st.steps.filter(x => x.choice_id !== "next").length + 1);
  const made = st.steps.filter(x => x.choice_id !== "next").length;

  let out = topLine() +
    '<div class="col"><div class="steps">' + Array.from({ length: total }, (_, i) =>
      '<i class="' + (i < made ? "done" : i === made ? "cur" : "") + '"></i>').join("") + "</div>" +
    '<span class="small muted">' + esc(c.title) + (sceneTitle(node.scene) ? " · " + esc(sceneTitle(node.scene)) : "") + "</span></div>";

  const prev = st.steps.length ? lastChoiceText() : "";
  out += '<div class="panel scene">';
  if ((node.characters || []).length) {
    out += '<div class="chars">' + node.characters.map(ch => {
      const t = charTitle(ch.id), mood = MOODS[ch.mood || "neutral"];
      return '<span class="ch"><em>' + esc(t.slice(0, 1)) + "</em><b>" + esc(t) + "</b>" +
        (mood ? "<span>" + esc(mood) + "</span>" : "") + "</span>";
    }).join("") + "</div>";
  }
  if (prev) out += '<p class="prev">Ваш выбор: ' + esc(prev) + "</p>";
  if (node.speaker) out += '<p class="speaker">' + esc(node.speaker) + "</p>";
  out += '<p class="text">' + esc(node.text) + "</p>";

  if (eng.meters.length) {
    out += '<div class="meters">' + eng.meters.map((m, i) => {
      const lo = eng.lo[i], hi = eng.hi[i], v = s.m[i];
      const w = hi > lo ? (v - lo) / (hi - lo) * 100 : 0;
      return '<span class="meter"><span>' + esc(m.title || m.code) + "</span><span>" + (v > 0 ? "+" : "") + v +
        '</span><span class="tr"><i style="left:0;width:' + w.toFixed(1) + '%"></i></span></span>';
    }).join("") + "</div>";
  }
  const choices = node.kind === "cut"
    ? [{ id: "next", text: node.button || "Далее", locked: false, hint: "" }]
    : node.choices.map(ch => ({ id: ch.id, text: ch.text, locked: !eng.available(ch, s), hint: ch.hint || "" }));
  out += '<div class="choices">' + choices.map(ch =>
    '<button class="choice' + (ch.locked ? " locked" : "") + '" data-ch="' + esc(ch.id) + '"' +
    (ch.locked ? " disabled" : "") + ">" + esc(ch.text) +
    (ch.locked && ch.hint ? '<span class="hint">Закрыто: ' + esc(ch.hint) + "</span>" : "") + "</button>").join("") + "</div>";
  out += "</div>";
  out += '<div class="row"><button class="btn ghost sm" id="quit">Выйти в список</button>' +
    (st.steps.length ? '<button class="btn ghost sm" id="undo">Шаг назад</button>' : "") + "</div>";
  return out;
}
function lastChoiceText() {
  const steps = st.steps.slice(0, -1), last = st.steps[st.steps.length - 1];
  const { node } = position(st.slug, steps);
  if (!node.choices || last.choice_id === "next") return "";
  const ch = node.choices.find(x => x.id === last.choice_id);
  return ch ? ch.text : "";
}

// ---------- итоги
function vFinal(finalId) {
  const c = BY_SLUG[st.slug], { g, ana, eng } = engine(st.slug);
  const sum = summarize(g, ana, st.steps, finalId, eng);
  const node = g.nodes[finalId];
  const pct = Math.round(sum.pct * 100);
  let out = topLine() + nav() + '<div class="col"><span class="small muted">' + esc(c.title) + "</span>" +
    '<div class="hero"><span class="big stars">' + [1, 2, 3].map(i => i <= sum.stars ? "★" : '<i>★</i>').join("") + "</span>" +
    "<h1>" + esc(node.title || OUTCOMES[sum.outcome]) + "</h1>" +
    '<span class="muted">' + esc(OUTCOMES[sum.outcome]) + " · " + pct + "% от оптимума</span></div></div>";
  if (node.text) out += '<div class="panel"><p class="text">' + esc(node.text) + "</p></div>";
  out += '<div class="panel col"><div class="kv"><span>Набрано баллов</span><b>' + sum.earned +
    " из " + sum.best_total + "</b>" +
    "<span>Оптимальных выборов</span><b>" + sum.counts.best + "</b>" +
    "<span>Приемлемых</span><b>" + sum.counts.good + "</b>" +
    "<span>Слабых</span><b>" + sum.counts.weak + "</b></div>";
  if (sum.competencies.length) {
    out += '<div class="bars">' + sum.competencies.map(r =>
      '<span class="bar"><span>' + esc(COMP[r.code] || r.code) + "</span><span>" +
      (r.pct === null ? "—" : r.pct + "%") + '</span><span class="tr"><i style="width:' +
      (r.pct === null ? 0 : r.pct) + '%"></i></span></span>').join("") + "</div>";
  }
  if (sum.flags.length) out += '<p class="small muted">По ходу кейса: ' + sum.flags.map(esc).join("; ") + ".</p>";
  out += "</div>";
  out += '<div class="row"><button class="btn" id="debrief">Разбор по шагам</button>' +
    '<button class="btn ghost" id="again">Пройти заново</button>' +
    '<button class="btn ghost" data-go="cases">К списку кейсов</button></div>';
  return out;
}

// ---------- разбор
function vDebrief() {
  const c = BY_SLUG[st.slug], { g, ana, eng } = engine(st.slug);
  const finalId = position(st.slug, st.steps).nid;
  const sum = summarize(g, ana, st.steps, finalId, eng);
  const rev = c.review || {};
  let out = topLine() + nav() + '<div class="col"><h1>Разбор</h1><span class="muted">' + esc(c.title) + "</span></div>";
  out += '<div class="col">' + sum.path.map((p, i) => {
    const note = (rev.node_notes || {})[p.node_id];
    return '<div class="step"><span class="r ' + p.rating + '">' + esc(RATINGS[p.rating]) + " · " +
      (p.points > 0 ? "+" : "") + p.points + " " + plural(Math.abs(p.points), "балл", "балла", "баллов") + "</span>" +
      '<span class="q">Шаг ' + (i + 1) + (note ? ". " + esc(note) : "") + "</span>" +
      "<b>" + esc(p.choice_text) + "</b>" +
      (p.feedback ? '<span class="fb">' + esc(p.feedback) + "</span>" : "") +
      (p.rating !== "best" ? '<span class="alt">Сильнее было бы: ' + esc(p.best_text) + "</span>" : "") + "</div>";
  }).join("") + "</div>";
  const fn = (rev.final_notes || {})[finalId];
  if (fn) out += '<div class="panel"><h3>Про этот финал</h3><p class="small" style="margin-top:6px">' + esc(fn) + "</p></div>";
  if ((rev.theory || []).length) {
    out += '<div class="panel col"><h2>Теория</h2>' + rev.theory.map(t =>
      "<div><h3>" + esc(t.title) + '</h3><p class="small muted" style="margin-top:4px">' + esc(t.text) + "</p></div>").join("") + "</div>";
  }
  if ((rev.takeaways || []).length) {
    out += '<div class="panel col"><h2>Главное</h2><ul class="ls small">' +
      rev.takeaways.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul></div>";
  }
  out += '<div class="row"><button class="btn" id="again">Пройти заново</button>' +
    '<button class="btn ghost" data-go="cases">К списку кейсов</button>' +
    '<button class="btn ghost" id="print">Распечатать разбор</button></div>';
  return out;
}

// ---------- мои результаты
function vMe() {
  const slugs = Object.keys(st.done);
  let out = topLine() + nav() + '<div class="col"><h1>Мои результаты</h1>' +
    '<p class="muted small">Сохраняются только в этом браузере: другой телефон или режим инкогнито их не увидят. ' +
    "Преподавателю результат показывают с экрана или выгружают файлом.</p></div>";
  if (!slugs.length) return out + '<div class="panel"><p class="muted">Пока ничего не пройдено.</p></div>';
  const agg = {};
  slugs.forEach(s => (st.done[s].comp || []).forEach(r => {
    if (r.max > 0) { agg[r.code] = agg[r.code] || [0, 0]; agg[r.code][0] += r.earned; agg[r.code][1] += r.max; }
  }));
  const codes = Object.keys(agg);
  if (codes.length) {
    out += '<div class="panel col"><h2>Профиль компетенций</h2><p class="small muted">По лучшей попытке каждого кейса.</p>' +
      '<div class="bars">' + codes.map(k => {
        const p = Math.min(100, Math.round(agg[k][0] / agg[k][1] * 100));
        return '<span class="bar"><span>' + esc(COMP[k] || k) + "</span><span>" + p +
          '%</span><span class="tr"><i style="width:' + p + '%"></i></span></span>';
      }).join("") + "</div></div>";
  }
  out += '<div class="cards">' + slugs.map(s => {
    const d = st.done[s], c = BY_SLUG[s];
    if (!c) return "";
    return '<button class="card" data-case="' + s + '"><div class="hd"><h3>' + esc(c.title) + "</h3>" +
      '<span class="badge ' + (d.outcome === "success" ? "done" : d.outcome === "fail" ? "fail" : "part") + '">' +
      stars(d.stars) + "</span></div><div class=\"tags\"><span class=\"tag\">" + Math.round(d.pct * 100) +
      "%</span><span class=\"tag\">" + esc(OUTCOMES[d.outcome]) + '</span><span class="tag">попыток: ' +
      d.attempts + "</span></div></button>";
  }).join("") + "</div>";
  out += '<div class="row"><button class="btn ghost" id="export">Скачать результаты файлом</button>' +
    '<button class="btn ghost" id="copy">Скопировать для преподавателя</button>' +
    '<button class="btn ghost" id="wipe">Удалить всё</button></div>';
  return out;
}
function record(slug, sum) {
  const prev = st.done[slug];
  const row = { stars: sum.stars, pct: sum.pct, outcome: sum.outcome,
                attempts: (prev ? prev.attempts : 0) + 1, ts: Date.now(),
                comp: sum.competencies.map(r => ({ code: r.code, earned: r.earned, max: r.max })) };
  if (!prev || sum.pct > prev.pct) st.done[slug] = row;
  else { prev.attempts = row.attempts; prev.ts = row.ts; }
  st.log.push({ slug, ts: row.ts, stars: sum.stars, pct: +sum.pct.toFixed(4), outcome: sum.outcome });
  if (st.log.length > 200) st.log = st.log.slice(-200);
  keep();
}
function plainReport() {
  const lines = ["УчительPRO — результаты", st.name ? st.name + (st.group ? ", " + st.group : "") : "без имени", ""];
  Object.keys(st.done).forEach(s => {
    const d = st.done[s], c = BY_SLUG[s];
    if (c) lines.push("• " + c.title + ": " + "★".repeat(d.stars) + "☆".repeat(3 - d.stars) + " " +
      Math.round(d.pct * 100) + "%, " + OUTCOMES[d.outcome] + ", попыток " + d.attempts);
  });
  return lines.join("\n");
}

function vMKShow() {

  out += '<div class="panel"><div class="mkmeta">' + m.meta.map(([k, v]) =>

  out += '<div class="col">' + m.blocks.map(b =>

function renderItems(items) {
  let out = "", open = "", n = 0;
  items.forEach(it => {
    const want = it.t === "num" ? "ol" : it.t === "bullet" ? "ul" : "";
    if (want !== open) { if (open) out += "</" + open + ">"; if (want) out += '<' + want + ' class="ls small">'; open = want; }
    if (it.t === "say") out += '<blockquote class="say">' + esc(it.v) + "</blockquote>";
    else if (it.t === "note") out += '<p class="mknote">' + esc(it.v) + "</p>";
    else if (want) out += "<li>" + esc(it.v) + "</li>";
    else out += '<p class="small">' + esc(it.v) + "</p>";
  });
  if (open) out += "</" + open + ">";
  return out;
}
